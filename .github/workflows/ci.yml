name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Type-check (TypeScript)
        run: |
          node -e "
            const fs = require('fs');
            fs.writeFileSync('tsconfig.check.json', JSON.stringify({
              compilerOptions: {
                module: 'nodenext', moduleResolution: 'nodenext',
                target: 'esnext', strict: true,
                noEmit: true, allowImportingTsExtensions: true,
                skipLibCheck: true
              },
              include: ['src/**/*.ts']
            }));
          "
          npx --yes -p typescript@5.6.3 tsc -p tsconfig.check.json
          rm -f tsconfig.check.json
      - name: Pruebas unitarias (servidor + lógica pura de la app)
        run: npm test

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias Kotlin
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tests-e2e } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pruebas end-to-end (Chromium)
        run: npx playwright test --project=chromium
