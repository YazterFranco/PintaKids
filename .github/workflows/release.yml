name: Compilar y publicar APK

# Al crear y subir una etiqueta (p. ej. v1.2.1), GitHub compila el APK firmado
# y lo publica en el servidor; los teléfonos avisan solos de la nueva versión.
on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
      NOTES: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar keystore
        run: |
          mkdir -p ../keystore-android
          printf '%s' "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ../keystore-android/alerta-release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nalias=alerta-sismica-pa\nkeystore=alerta-release.keystore\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_PASSWORD }}" > ../keystore-android/keystore.properties

      - name: Siguiente número de versión (pregunta al servidor)
        id: ver
        run: |
          cur=$(curl -sf "$APP_URL/v1/app-version" | jq -r '.versionCode // 0' 2>/dev/null || echo 0)
          echo "code=$((cur + 1))" >> "$GITHUB_OUTPUT"
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compilar release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCodeOverride=${{ steps.ver.outputs.code }} \
            -PversionNameOverride=${{ steps.ver.outputs.name }}

      - name: Publicar en el servidor
        run: |
          notes=$(printf '%s' "$NOTES" | head -c 200 | jq -sRr @uri)
          curl -sf -X POST "$APP_URL/v1/admin/apk" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            -H "X-Version-Code: ${{ steps.ver.outputs.code }}" \
            -H "X-Version-Name: ${{ steps.ver.outputs.name }}" \
            -H "X-Notes: $notes" \
            --data-binary @android/app/build/outputs/apk/release/app-release.apk
          echo "Publicada la versión ${{ steps.ver.outputs.name }} (código ${{ steps.ver.outputs.code }})"
