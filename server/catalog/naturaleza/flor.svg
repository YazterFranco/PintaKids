  <circle cx="52" cy="100" r="22" fill="#ffb7b7" stroke="#e86a8a" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="74" cy="74" r="22" fill="#ffb7b7" stroke="#e86a8a" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="126" cy="74" r="22" fill="#ffb7b7" stroke="#e86a8a" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="74" cy="126" r="22" fill="#ffb7b7" stroke="#e86a8a" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="126" cy="126" r="22" fill="#ffb7b7" stroke="#e86a8a" stroke-width="4" stroke-linejoin="round"/>

