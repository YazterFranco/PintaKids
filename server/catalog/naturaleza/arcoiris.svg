  <path d="M52 152 Q100 52 148 152" fill="none" stroke="#ffe082" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 144 Q100 64 136 144" fill="none" stroke="#a7e9af" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M76 136 Q100 76 124 136" fill="none" stroke="#a8e6ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nube izquierda (cerrada) -->
