  <circle cx="72" cy="56" r="26" fill="#a7e9af" stroke="#6aad1a" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="128" cy="56" r="26" fill="#a7e9af" stroke="#6aad1a" stroke-width="5" stroke-linejoin="round"/>

