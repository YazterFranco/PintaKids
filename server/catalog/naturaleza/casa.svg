<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Cuerpo de la casa (cerrado) -->
  <rect x="60" y="100" width="80" height="80" rx="12" fill="#ffe082" stroke="#e6b54d" stroke-width="5" stroke-linejoin="round"/>

  <!-- Techo (cerrado) -->
  <path d="M50 100 L100 50 L150 100 Z" fill="#ffb7b7" stroke="#e86a8a" stroke-width="5" stroke-linejoin="round"/>

  <!-- Puerta (cerrada) -->
  <rect x="90" y="130" width="20" height="50" rx="8" fill="#fffbeb" stroke="#d4a373" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ventana (cerrada) -->
  <rect x="72" y="112" width="24" height="24" rx="6" fill="#a8e6ff" stroke="#4cc9f0" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ojos kawaii en la casa -->
  <circle cx="78" cy="122" r="3" fill="#2b2d42"/>
  <circle cx="92" cy="122" r="3" fill="#2b2d42"/>
  <!-- Boca sonriente -->
  <path d="M78 132 Q90 138 102 132" fill="none" stroke="#2b2d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Humo de la chimenea (cerrado) -->
