<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2563EB">
  <meta name="description" content="Pintakids: dibuja, colorea y cuenta historias. Gratis y sin anuncios.">
  <title>Pintakids</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="logo" id="logo-icon"></span>
    <h1 data-i18n="app.name">Pintakids</h1>
    <span id="starScore" class="stars" aria-live="polite">0</span>
  </header>

  <main id="views">
    <section id="view-draw" class="view" aria-label="Dibujar"></section>
    <section id="view-color" class="view" hidden aria-label="Colorear"></section>
    <section id="view-learn" class="view" hidden aria-label="Aprender"></section>
    <section id="view-photo" class="view" hidden aria-label="Foto"></section>
    <section id="view-story" class="view" hidden aria-label="Cuentos"></section>
    <section id="view-gallery" class="view" hidden aria-label="Galería"></section>
    <section id="view-parents" class="view" hidden aria-label="Padres"></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="secciones">
    <button class="tab" data-view="draw" role="tab"><span class="tab-icon"></span><b data-i18n="tab.draw">Dibujar</b></button>
    <button class="tab" data-view="color" role="tab"><span class="tab-icon"></span><b data-i18n="tab.color">Colorear</b></button>
    <button class="tab" data-view="learn" role="tab"><span class="tab-icon"></span><b data-i18n="tab.learn">Aprender</b></button>
    <button class="tab" data-view="photo" role="tab"><span class="tab-icon"></span><b data-i18n="tab.photo">Foto</b></button>
    <button class="tab" data-view="story" role="tab"><span class="tab-icon"></span><b data-i18n="tab.story">Cuentos</b></button>
    <button class="tab" data-view="gallery" role="tab"><span class="tab-icon"></span><b data-i18n="tab.gallery">Galería</b></button>
    <button class="tab" data-view="parents" role="tab"><span class="tab-icon"></span><b data-i18n="tab.parents">Padres</b></button>
  </nav>

  <footer>
    <div id="timeUp" class="overlay" hidden>
      <div class="overlay-card">
        <div class="overlay-icon" id="clock-icon"></div>
        <p data-i18n="parents.timeUp"></p>
      </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <div id="offline" class="pill pill-offline" hidden data-i18n="offline.note"></div>
  </footer>
</body>
</html>
