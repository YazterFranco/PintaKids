<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- La misma política que envía el servidor, aquí también para el APK (que no tiene servidor). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' data: blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="description" content="Pintakids: dibuja, colorea y aprende a dibujar paso a paso. Gratis y sin anuncios.">
  <title>Pintakids — Dibujar y Colorear para Niños</title>

  <link rel="canonical" href="https://pintakids.app/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pintakids">
  <meta property="og:title" content="Pintakids — Dibujar y Colorear para Niños">
  <meta property="og:description" content="Dibuja, colorea y aprende a dibujar paso a paso. Gratis, sin anuncios y sin conexión a internet.">
  <meta property="og:image" content="/assets/og-cover.png">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pintakids">

  <link rel="manifest" href="/manifest.webmanifest?v=9">
  <link rel="icon" href="/assets/icon.svg?v=9" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-192.png?v=9">
  <link rel="stylesheet" href="/style.css?v=9">
  <script src="/bootcheck.js?v=9"></script>
  <script type="module" src="/app.js?v=9"></script>
</head>
<body data-view="home">
  <header id="appbar" class="appbar">
    <button class="appbar-home" data-testid="home" type="button" data-i18n-title="common.home" aria-label="Inicio"></button>
    <span class="appbar-logo" id="logo-icon" aria-hidden="true"></span>
    <h1 id="appbar-title" data-i18n="app.name">Pintakids</h1>
    <span id="starScore" class="stars" aria-live="polite">0</span>
    <button class="appbar-lock" data-testid="parents" type="button" data-i18n-title="tab.parents" aria-label="Padres"></button>
  </header>

  <main id="views">
    <section id="view-home" class="view" aria-label="Inicio"></section>
    <section id="view-draw" class="view" hidden aria-label="Dibujar"></section>
    <section id="view-learn" class="view" hidden aria-label="Dibuja conmigo"></section>
    <section id="view-color" class="view" hidden aria-label="Colorear"></section>
    <section id="view-photo" class="view" hidden aria-label="Foto"></section>
    <section id="view-story" class="view" hidden aria-label="Cuentos"></section>
    <section id="view-gallery" class="view" hidden aria-label="Galería"></section>
    <section id="view-parents" class="view" hidden aria-label="Padres"></section>
  </main>

  <footer>
    <div id="timeUp" class="overlay" hidden>
      <div class="overlay-card">
        <div class="overlay-icon" id="clock-icon"></div>
        <p data-i18n="parents.timeUp"></p>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="offline" class="pill pill-offline" hidden data-i18n="offline.note"></div>
  </footer>
</body>
</html>
